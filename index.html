<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#321541">
<title>24Adz.com | விரைவில் வருகிறோம்</title>
<style>
:root{--purple:#6a1b9a;--deep:#16091f;--orange:#ff7900;--white:#fff;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 18% 20%,#6a1b9a99,transparent 36%),radial-gradient(ellipse at 82% 78%,#ff790044,transparent 35%),linear-gradient(135deg,#100617,#24102f 55%,#100617);color:var(--white);font-family:Arial,"Noto Sans Tamil",sans-serif;}
.scene{position:relative;width:min(1100px,94vw);min-height:min(650px,92vh);display:flex;align-items:center;justify-content:center;text-align:center;padding:35px 16px;isolation:isolate;}
.scene:before{content:"";position:absolute;inset:-40%;z-index:-2;background:conic-gradient(from 0deg,transparent 0 20%,#a45ac433 27%,transparent 38% 57%,#ff790033 68%,transparent 78%);animation:rotate 22s linear infinite;}
.scene:after{content:"";position:absolute;inset:5%;border:1px solid #ffffff26;border-radius:28px;box-shadow:0 0 55px #6a1b9a33,inset 0 0 55px #ff790012;z-index:-1;}
.content{width:100%;animation:enter 1.2s cubic-bezier(.2,.8,.2,1) both;}
.brand{font-size:clamp(48px,10vw,112px);font-weight:1000;letter-spacing:-3px;line-height:1;margin:0 0 24px;color:#fff;text-shadow:0 1px 0 #ddd,0 2px 0 #bbb,0 3px 0 #999,0 4px 0 #777,0 5px 0 #555,0 8px 0 #321541,0 13px 20px #000b,0 0 28px #ff790077;transform:perspective(700px) rotateX(7deg);animation:brandFloat 3s ease-in-out infinite alternate;}
.brand .adz{color:var(--orange);text-shadow:0 1px 0 #ffd0a3,0 2px 0 #d85b00,0 3px 0 #a84600,0 5px 0 #632800,0 10px 20px #000b,0 0 30px #ff790099;}
.rule{width:min(520px,70%);height:3px;margin:0 auto 34px;background:linear-gradient(90deg,transparent,var(--orange),#fff,var(--purple),transparent);box-shadow:0 0 18px #ff7900;}
.tamil{margin:0;font-weight:1000;font-size:clamp(42px,8vw,90px);line-height:1.38;letter-spacing:1px;color:#fff;text-shadow:0 1px 0 #f3e8ff,0 2px 0 #d4b8e7,0 3px 0 #a875c8,0 4px 0 #6a1b9a,0 6px 0 #43115f,0 9px 0 #2a0b3d,0 14px 18px #000c,0 0 22px #a45ac4,0 0 42px #ff790055;transform:perspective(600px) rotateX(5deg);animation:tamilGlow 2s ease-in-out infinite alternate;}
.tamil span{display:block;color:#ffb15e;text-shadow:0 1px 0 #fff0dc,0 2px 0 #ffc27c,0 3px 0 #ff7900,0 5px 0 #b94e00,0 8px 0 #713000,0 13px 18px #000c,0 0 24px #ff7900;}
.sub{margin:26px 0 0;font-size:clamp(12px,2vw,18px);letter-spacing:clamp(2px,.6vw,6px);font-weight:800;color:#eee;text-transform:uppercase;}
.spark{position:absolute;color:#fff3d7;text-shadow:0 0 18px var(--orange);font-size:clamp(18px,3vw,32px);animation:sparkle 3s ease-in-out infinite;}
.s1{top:17%;left:12%}.s2{top:24%;right:12%;animation-delay:.8s}.s3{bottom:18%;left:18%;animation-delay:1.4s}.s4{bottom:17%;right:17%;animation-delay:2s}
@keyframes rotate{to{transform:rotate(360deg)}}
@keyframes enter{from{opacity:0;transform:translateY(25px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes brandFloat{to{transform:perspective(700px) rotateX(2deg) translateY(-6px)}}
@keyframes tamilGlow{from{filter:brightness(.9);transform:perspective(600px) rotateX(7deg) scale(1)}to{filter:brightness(1.18);transform:perspective(600px) rotateX(2deg) scale(1.025)}}
@keyframes sparkle{0%,100%{opacity:.25;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.25) rotate(22deg)}}
@media(max-width:560px){.scene{min-height:85vh;padding:25px 12px}.scene:after{inset:2%;border-radius:18px}.brand{letter-spacing:-2px;margin-bottom:20px}.rule{margin-bottom:24px}.tamil{letter-spacing:0}.s1{left:7%}.s2{right:7%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style>
</head>
<body>
<main class="scene" aria-label="24Adz.com விரைவில் வருகிறோம்">
  <span class="spark s1">✦</span><span class="spark s2">✧</span><span class="spark s3">✦</span><span class="spark s4">✧</span>
  <div class="content">
    <h1 class="brand">24<span class="adz">Adz</span>.com</h1>
    <div class="rule"></div>
    <h2 class="tamil">விரைவில்<span>வருகிறோம்</span></h2>
    <p class="sub">Tamil Nadu Classifieds</p>
  </div>
</main>
</body>
</html>
